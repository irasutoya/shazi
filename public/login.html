<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 | shazi.wiki</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="/styles.css?v=20260511d">
  </head>
  <body class="login-body">
    <main class="login-shell">
      <form id="loginForm" class="login-panel">
        <a class="brand" href="/">
          <span class="brand-mark">傻逼</span>
          <span>
            <strong>shazi.wiki</strong>
            <small>管理后台登录</small>
          </span>
        </a>
        <div>
          <h1>登录后台</h1>
        </div>
        <label class="field">
          <span>账号</span>
          <input id="username" autocomplete="username" required>
        </label>
        <label class="field">
          <span>密码</span>
          <input id="password" type="password" autocomplete="current-password" required>
        </label>
        <button class="primary-button" type="submit">登录</button>
        <p id="loginMessage" class="form-message" role="status"></p>
      </form>
    </main>
    <script type="module" src="/login.js?v=20260511d"></script>
  </body>
</html>
